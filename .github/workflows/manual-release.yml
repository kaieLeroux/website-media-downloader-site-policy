name: Manual Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit ID to release (e.g., a1b2c3d)'
        required: true
      tag_name:
        description: 'Tag name for the release (e.g., v1.5.3)'
        required: true
      release_name:
        description: 'Name of the release (leave empty to use commit title)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get Commit Details
        id: commit_info
        run: |
          SHA="${{ github.event.inputs.commit_sha }}"
          TITLE=$(git log -1 --pretty=%s "$SHA")
          BODY=$(git log -1 --pretty=%b "$SHA")
          
          # Use provided release_name or fallback to commit title
          CUSTOM_NAME="${{ github.event.inputs.release_name }}"
          if [ -n "$CUSTOM_NAME" ]; then
            FINAL_NAME="$CUSTOM_NAME"
          else
            FINAL_NAME="$TITLE"
          fi
          
          echo "release_name=$FINAL_NAME" >> $GITHUB_OUTPUT
          
          if [ -z "$BODY" ]; then
            echo "body=$TITLE" >> $GITHUB_OUTPUT
          else
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Run Build Script
        run: |
          node src/build.js all

      - name: Create Release Archives
        run: |
          # Package chrome build
          cd build/chrome
          zip -r ../../website-media-downloader-chrome-${{ github.event.inputs.tag_name }}.zip ./*
          cd ../..

          # Package chrome-yt build
          cd build/chrome-yt
          zip -r ../../website-media-downloader-chrome-yt-${{ github.event.inputs.tag_name }}.zip ./*
          cd ../..
          
          # Package firefox build
          cd build/firefox
          zip -r ../../website-media-downloader-firefox-${{ github.event.inputs.tag_name }}.xpi ./*
          cd ../..

          # Package Firefox clean source code (mirrors root: src/ folder, metadata in root)
          zip -r website-media-downloader-firefox-source-${{ github.event.inputs.tag_name }}.zip src README.md LICENSE.md CONTRIBUTING.md licenses -x "src/overrides/*" "src/build.js"

          # Package Chrome clean source code (mirrors root: src/ folder with overrides applied, metadata in root)
          mkdir -p chrome-source-temp/src
          cp -r build/chrome/* chrome-source-temp/src/
          cp README.md LICENSE.md CONTRIBUTING.md chrome-source-temp/
          cp -r licenses chrome-source-temp/
          cd chrome-source-temp
          zip -r ../website-media-downloader-chrome-source-${{ github.event.inputs.tag_name }}.zip ./*
          cd ..
          rm -rf chrome-source-temp

          # Package Chrome-YT clean source code (mirrors root: src/ folder with overrides applied, metadata in root)
          mkdir -p chrome-yt-source-temp/src
          cp -r build/chrome-yt/* chrome-yt-source-temp/src/
          cp README.md LICENSE.md CONTRIBUTING.md chrome-yt-source-temp/
          cp -r licenses chrome-yt-source-temp/
          cd chrome-yt-source-temp
          zip -r ../website-media-downloader-chrome-yt-source-${{ github.event.inputs.tag_name }}.zip ./*
          cd ..
          rm -rf chrome-yt-source-temp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ steps.commit_info.outputs.release_name }}
          body: ${{ steps.commit_info.outputs.body }}
          files: |
            website-media-downloader-chrome-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-firefox-${{ github.event.inputs.tag_name }}.xpi
            website-media-downloader-chrome-source-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-chrome-yt-source-${{ github.event.inputs.tag_name }}.zip
            website-media-downloader-firefox-source-${{ github.event.inputs.tag_name }}.zip
          target_commitish: ${{ github.event.inputs.commit_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
